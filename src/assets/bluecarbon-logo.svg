  <circle cx="330" cy="216" r="8" fill="#001e40"/>

  <!-- Circuit Track 4 -->
  <line x1="284" y1="227" x2="314" y2="252" stroke="#001e40" stroke-width="6" stroke-linecap="round"/>
  <circle cx="316" cy="254" r="8" fill="#001e40"/>

  <!-- Right Lower Vein Track -->
  <path d="M256 280 L290 295 L290 338" stroke="#00abc1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center Blockchain Hexagon Structure -->
  <!-- Outer Hexagon Border -->
  <polygon points="256,186 282,201 282,231 256,246 230,231 230,201" stroke="#001e40" stroke-width="8" stroke-linejoin="round" fill="#ffffff"/>
  <!-- Inner Cyan Hexagon Core -->
