  <!-- Left Inner Circuit Veins & Nodes (Turquoise #00abc1) -->
  <path d="M256 265 L220 295" stroke="#00abc1" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="228" y1="190" x2="198" y2="175" stroke="#00abc1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="196" cy="174" r="9" fill="#00abc1"/>

